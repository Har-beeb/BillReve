<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/billreve.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">

    <title>BillReve | Intelligent Invoicing & Billing Platform</title>
    <meta name="description" content="BillReve is the premier offline-first invoicing platform designed for modern SMEs and enterprises. Create quotes, manage clients, and track payments without worrying about internet connectivity." />
    <meta name="keywords" content="invoice, billing, invoice generator, quotes, small business, payments, offline invoicing, revenue ai" />
    <link rel="canonical" href="https://billreve.app/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://billreve.app/" />
    <meta property="og:title" content="BillReve | Intelligent Invoicing & Billing Platform" />
    <meta property="og:description" content="BillReve is the premier offline-first invoicing platform designed for modern SMEs and enterprises. Create quotes, manage clients, and track payments without worrying about internet connectivity." />
    <meta property="og:image" content="https://billreve.app/og-thumbnail.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://billreve.app/" />
    <meta property="twitter:title" content="BillReve | Intelligent Invoicing & Billing Platform" />
    <meta property="twitter:description" content="BillReve is the premier offline-first invoicing platform designed for modern SMEs and enterprises. Create quotes, manage clients, and track payments without worrying about internet connectivity." />
    <meta property="twitter:image" content="https://billreve.app/og-thumbnail.png" />
  </head>
  <body>
    <div id="root">
      <!--
        Static fallback. The crawler (and any client where the bundle fails or
        is still loading) would otherwise receive an entirely empty body with a
        200 status, which Google classifies as a soft 404. React replaces this
        on mount.
      -->
      <div style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;max-width:640px;margin:12vh auto;padding:0 24px;text-align:center;color:#1e293b;">
        <h1 style="font-size:1.75rem;margin:0 0 12px;">BillReve — Intelligent Invoicing &amp; Billing</h1>
        <p style="font-size:1rem;line-height:1.6;color:#475569;margin:0;">
          Offline-first invoicing for freelancers, SMEs and organizations. Create
          quotes and invoices, negotiate with clients, and get paid — even without
          an internet connection.
        </p>
        <noscript>
          <p style="margin-top:20px;color:#b91c1c;">
            BillReve needs JavaScript enabled to run. Please enable it and reload
            this page.
          </p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
